<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cape Town Cams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: wall of 16:9 monitors, header strip with SAST clock and column control */
  :root {
    --bg: #0e1214;
    --panel: #161c1f;
    --line: #253035;
    --fg: #e6ecee;
    --muted: #8a9a9f;
    --live: #ff4d3d;
    --accent: #5cc8d6;
    --display: "Archivo", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --cols: 3;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); }
  .wrap { padding: 20px 16px 32px; max-width: 1800px; margin: 0 auto; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
  .clock { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .controls { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .controls span { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-right: 4px; }
  button {
    font: 500 12px var(--mono); color: var(--fg); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(min(var(--cols), 2), minmax(0, 1fr)); } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .controls { display: none; } }

  .cam { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .cam.big { grid-column: 1 / -1; }
  .screen { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Embedding blocked: poster image from YouTube, click opens the shared pop-out player window */
  .offline {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 16px;
    color: var(--fg); text-decoration: none;
    background: repeating-linear-gradient(135deg, #12181a 0 12px, #151c1f 12px 24px);
    background-size: cover; background-position: center;
  }
  .offline .watch {
    display: inline-flex; align-items: center; gap: 8px; font: 500 13px var(--mono);
    background: rgba(14,18,20,0.85); border: 1px solid var(--line); border-radius: 4px; padding: 9px 14px;
  }
  .offline .watch::before { content: ""; border-style: solid; border-width: 5px 0 5px 9px; border-color: transparent transparent transparent var(--live); }
  .offline:hover .watch { border-color: var(--accent); color: var(--accent); }
  .offline .title { font: 700 clamp(18px, 2.4vw, 28px) var(--display); text-shadow: 0 2px 12px rgba(0,0,0,0.7); margin-bottom: 4px; }
  .credit {
    position: absolute; right: 6px; bottom: 6px; font: 400 10px var(--mono); color: rgba(230,236,238,0.75);
    background: rgba(14,18,20,0.6); padding: 2px 5px; border-radius: 3px; text-decoration: none;
  }
  .credit:hover { color: var(--accent); }
  .offline small { font: 400 11px var(--mono); color: var(--fg); background: rgba(14,18,20,0.7); padding: 2px 6px; border-radius: 3px; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; box-shadow: 0 0 0 3px rgba(255,77,61,0.18); }
  .dot.ext { background: var(--muted); box-shadow: none; }
  .name { font-size: 14px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .area { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .bar a, .bar button { font-family: var(--mono); font-size: 11px; color: var(--muted); text-decoration: none; padding: 3px 6px; }
  .bar a:hover { color: var(--accent); }
  @media (prefers-reduced-motion: no-preference) { .dot:not(.ext) { animation: pulse 2s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cape Town Cams</h1>
    <div class="clock" id="clock">SAST --:--</div>
    <div class="controls" role="group" aria-label="Columns">
      <span>Columns</span>
      <button id="c2" data-cols="2">2</button>
      <button id="c3" data-cols="3" aria-pressed="true">3</button>
      <button id="reload">Reload all</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
  // Add or remove cams here. embed:false = owner has blocked embedding, so the tile links out.
  // Non-YouTube cams: give src (player URL to embed) and link (page to open) instead of id.
  // Blocked cams can set poster (local photo) and credit [text, url]; otherwise YouTube's thumbnail is used.
  const CAMS = [
    { id: "fhUEi-ka6Ks", name: "Table Mountain", area: "City Bowl" },
    { id: "catxvTQieyY", name: "Table Mountain (second view)", area: "City Bowl" },
    { id: "-Qi7IXhSScA", name: "Signal Hill", area: "City Bowl" },
    { id: "8xvFxAPpEtc", name: "Signal Hill and CBD", area: "City Bowl" },
    { id: "4Zu64CmAjMo", name: "Sea Point and Lion's Head", area: "Atlantic" },
    { id: "IGu55JrxyHU", name: "Clifton 4th Beach", area: "Atlantic", embed: false, poster: "img/clifton-4th.jpg",
      credit: ["Warren Rohner, CC BY-SA 2.0", "https://commons.wikimedia.org/wiki/File:Clifton_4th_Beach.jpg"] },
    { id: "vOLCjL4kv-w", name: "Table Mountain from Bloubergstrand", area: "Table Bay" },
    { name: "Big Bay", area: "Table Bay", src: "https://g0.ipcamlive.com/player/player.php?alias=bigbaybigboy&autoplay=1", link: "https://bigbaylifesaving.co.za/" },
    { id: "mxEholKv57A", name: "Langebaan Lagoon", area: "West Coast" },
    { id: "H_wV0IBf_R8", name: "Muizenberg Beach", area: "False Bay" },
    { id: "VuE8e798RuM", name: "Muizenberg Surf", area: "False Bay" },
    { id: "nK3l-mKYCwc", name: "Strand Beach", area: "False Bay", embed: false, poster: "img/strand.jpg",
      credit: ["SkyPixels, CC BY-SA 4.0", "https://commons.wikimedia.org/wiki/File:Strand_Beach_Promenade.jpg"] },
    { id: "bVtf0Qcc_gY", name: "Nature's Valley, Plettenberg Bay", area: "Garden Route" }
  ];

  const grid = document.getElementById("grid");
  const watch = id => "https://www.youtube.com/watch?v=" + id;
  const src = id => "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1&rel=0";
  const embedUrl = cam => cam.src || src(cam.id);
  const linkUrl = cam => cam.link || watch(cam.id);
  const poster = cam => "linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.55)), " + (cam.poster ? `url(${cam.poster})` :
    `url(https://i.ytimg.com/vi/${cam.id}/maxresdefault_live.jpg), url(https://i.ytimg.com/vi/${cam.id}/hqdefault.jpg)`);

  function screen(cam) {
    if (cam.embed === false) {
      return `<a class="offline" href="${linkUrl(cam)}" target="_blank" rel="noopener" data-popout
        style="${cam.id || cam.poster ? `background-image: ${poster(cam)}` : ""}">
        <span class="title">${cam.name} webcam</span>
        <span class="watch">Watch on ${cam.src ? "website" : "YouTube"}</span><small>Opens in pop-out player</small></a>
        ${cam.credit ? `<a class="credit" href="${cam.credit[1]}" target="_blank" rel="noopener">Photo: ${cam.credit[0]}</a>` : ""}`;
    }
    return `<iframe src="${embedUrl(cam)}" title="${cam.name} live"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe>`;
  }

  grid.innerHTML = CAMS.map((c, i) => `
    <article class="cam" id="cam-${i}">
      <div class="screen">${screen(c)}</div>
      <div class="bar">
        <span class="dot${c.embed === false ? " ext" : ""}"></span>
        <span class="name">${c.name}</span>
        <span class="area">${c.area}</span>
        ${c.embed === false ? "" : `<button data-big="${i}" title="Make this cam full width">Enlarge</button>`}
        <a href="${linkUrl(c)}" target="_blank" rel="noopener"${c.embed === false ? " data-popout" : ""}>${c.src ? "Website" : "YouTube"}</a>
      </div>
    </article>`).join("");

  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-big]");
    if (!b) return;
    const card = document.getElementById("cam-" + b.dataset.big);
    const on = !card.classList.contains("big");
    document.querySelectorAll(".cam.big").forEach(c => { c.classList.remove("big"); c.querySelector("[data-big]").textContent = "Enlarge"; });
    if (on) { card.classList.add("big"); b.textContent = "Shrink"; grid.prepend(card); }
  });

  // Blocked streams all open in one reusable pop-out window, so clicking the next cam replaces the last.
  // Cmd/Ctrl/Shift/middle-click still opens a normal tab.
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-popout]");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    const scr = window.screen;
    const w = Math.min(1100, scr.availWidth - 40), h = Math.round(w * 9 / 16) + 140;
    const win = window.open(a.href, "camPopout",
      `popup,width=${w},height=${h},left=${scr.availWidth - w - 20},top=40`);
    if (win) { e.preventDefault(); win.focus(); }
  });

  document.querySelectorAll("[data-cols]").forEach(btn => btn.addEventListener("click", () => {
    document.documentElement.style.setProperty("--cols", btn.dataset.cols);
    document.querySelectorAll("[data-cols]").forEach(b => b.setAttribute("aria-pressed", b === btn));
  }));

  document.getElementById("reload").addEventListener("click", () => {
    document.querySelectorAll(".screen iframe").forEach(f => { f.src = f.src; });
  });

  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = "SAST " + new Date().toLocaleTimeString("en-ZA",
    { timeZone: "Africa/Johannesburg", hour: "2-digit", minute: "2-digit" });
  tick(); setInterval(tick, 15000);
</script>
</body>
</html>
