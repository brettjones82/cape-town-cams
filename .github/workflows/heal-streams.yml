# Twice a day, swap in new video IDs for YouTube live streams that were restarted (scripts/heal_streams.py).
# Run it by hand from the repo's Actions tab ("Run workflow").
name: Stream check

on:
  schedule:
    # Odd minutes: GitHub delays or drops scheduled runs when busy, worst on the hour.
    - cron: "43 2 * * *"    # 04:43 in Cape Town
    - cron: "13 12 * * *"   # 14:13 in Cape Town
    - cron: "7,22,37,52 * * * *"   # TEMPORARY: proves the schedule fires; remove once a scheduled run shows up
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Look for restarted streams
        id: check
        run: python3 scripts/heal_streams.py

      - name: Commit and publish any updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update restarted stream IDs (daily check)"
          git push
          # Pushes made by this job don't start a Pages build on their own, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"

      # A failed run makes GitHub email the repo owner, so problems don't go unnoticed.
      - name: Report problems
        if: steps.check.outputs.problems == '1'
        run: |
          echo "::error::Some streams couldn't be checked or updated. See the run summary."
          exit 1
